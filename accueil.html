<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes carnets de voyage</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1a2b;--blue:#3d95e6;--m:#aebccb;--l:#24465f}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;background:var(--bg)}
body{color:#f2f6fa;font:17px/1.5 Outfit,system-ui,sans-serif;background:radial-gradient(circle at 50% 18%,#14406a 0%,#0a1a2b 55%,#050d18 100%) fixed;min-height:100vh;overflow-x:hidden}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,footer{position:relative;z-index:1}
.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:max(28px,env(safe-area-inset-top)) 22px 90px}
.hero svg{width:min(88vw,430px);overflow:visible;margin-bottom:6px}
.arc{fill:none;stroke:rgba(255,255,255,.6);stroke-width:2.5;stroke-dasharray:6 8;animation:dash 1.5s linear infinite}
.pin{fill:#fff;stroke:var(--blue);stroke-width:3}
.ring{fill:none;stroke:var(--blue);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}.r2{animation-delay:1.2s}
h1{font-size:clamp(34px,8vw,58px);font-weight:600;line-height:1.08;letter-spacing:.005em;animation:up .9s .1s both}
.tag{color:var(--m);font-size:clamp(16px,3.6vw,20px);margin-top:10px;max-width:30ch;animation:up .9s .35s both}
.btns{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:34px;animation:up .9s .6s both}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 28px;border-radius:32px;font-weight:600;font-size:18px;text-decoration:none;transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-2px)}
.b1{background:#fff;color:var(--bg)}
.b2{background:rgba(10,26,43,.45);color:#fff;border:1.5px solid rgba(255,255,255,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}.b2:hover{background:rgba(255,255,255,.12)}
.btn svg{width:20px;height:20px;margin:0;fill:currentColor}
.down{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);color:var(--m);line-height:0;text-decoration:none;animation:bob 2.2s ease-in-out infinite}
#albums{max-width:1040px;margin:0 auto;padding:30px 20px 60px}
#albums h2{font-size:28px;font-weight:600;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.card{position:relative;display:block;aspect-ratio:4/3;border-radius:30px;overflow:hidden;background:#234;border:2px solid #ffffff44;color:#fff;text-decoration:none;transition:transform .25s,border-color .25s}
.card:hover{transform:translateY(-4px);border-color:#ffffffaa}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card i{position:absolute;inset:0;background:linear-gradient(transparent 38%,#000c)}
.card div{position:absolute;left:20px;right:20px;bottom:16px}
.card b{display:block;font-size:23px;font-weight:500;line-height:1.15}.card b b{font-weight:700;display:inline}
.card small{color:#d4dde6;font-size:14px}
.empty{color:var(--m);padding:20px 0}
footer{text-align:center;color:var(--m);font-size:13px;padding:10px 20px calc(30px + env(safe-area-inset-bottom))}
footer a{color:var(--m)}footer svg{vertical-align:-3px}
@keyframes dash{to{stroke-dashoffset:-14}}@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(3.4);opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}@keyframes bob{50%{transform:translate(-50%,5px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<main>
 <section class="hero">
  <svg viewBox="0 0 400 180" aria-hidden="true">
   <path id="arc" class="arc" d="M30 150 Q200 -30 370 120"/>
   <circle class="ring" cx="30" cy="150" r="7"/><circle class="pin" cx="30" cy="150" r="7"/>
   <circle class="ring r2" cx="370" cy="120" r="7"/><circle class="pin" cx="370" cy="120" r="7"/>
   <g><path d="M12 2c.8 0 1.5.7 1.5 1.5V9l8 5v2l-8-2.5V19l2 1.5V22l-3.5-1L8.5 22v-1.5l2-1.5v-5.5L2.5 16v-2l8-5V3.5C10.5 2.7 11.2 2 12 2z" fill="#fff" transform="translate(-12,-12) rotate(90 12 12) scale(1.15)"/>
    <animateMotion dur="4.2s" repeatCount="indefinite" rotate="auto"><mpath href="#arc" xlink:href="#arc"/></animateMotion></g>
  </svg>
  <h1>Mes carnets de voyage</h1>
  <p class="tag">Des étapes, des photos et des souvenirs, d’un bout à l’autre du monde.</p>
  <div class="btns">
   <a class="btn b1" href="#albums"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm-1 17.9A8 8 0 014.1 13H8c.1 1.7.5 3.3 1.2 4.7.5.9 1 1.6 1.8 2.2zM4.1 11A8 8 0 0111 4.1c-.8.6-1.3 1.3-1.8 2.2C8.5 7.7 8.1 9.3 8 11H4.1zM10 11c.1-1.5.5-2.9 1-4 .4-.8.7-1.2 1-1.5.3.3.6.7 1 1.5.5 1.1.9 2.5 1 4h-4zm0 2h4c-.1 1.5-.5 2.9-1 4-.4.8-.7 1.2-1 1.5-.3-.3-.6-.7-1-1.5-.5-1.1-.9-2.5-1-4zm5.9-2c-.1-1.7-.5-3.3-1.2-4.7-.5-.9-1-1.6-1.8-2.2A8 8 0 0119.9 11H16zm-1 8.9c.8-.6 1.3-1.3 1.8-2.2.7-1.4 1.1-3 1.2-4.7h3.9a8 8 0 01-6.9 6.9z"/></svg>Voir les albums</a>
   <a class="btn b2" href="editeur.html"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zM20.7 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>Éditer mes carnets</a>
  </div>
  <a class="down" href="#albums" aria-label="Descendre vers les albums"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="margin:0"><path d="M5 9l7 7 7-7"/></svg></a>
 </section>
 <section id="albums">
  <h2>Mes albums</h2>
  <div class="grid" id="list"></div>
 </section>
</main>
<footer>Réalisé à l’aide de Claude <svg width="14" height="14" viewBox="0 0 24 24" stroke="#D97757" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="15.2" x2="12" y2="1"/><line x1="15.2" y1="12" x2="23" y2="12"/><line x1="12" y1="8.8" x2="12" y2="23"/><line x1="8.8" y1="12" x2="1" y2="12"/><line x1="14.8" y1="14.8" x2="19.6" y2="19.6"/><line x1="9.2" y1="14.8" x2="4.4" y2="19.6"/><line x1="14.8" y1="9.2" x2="19.6" y2="4.4"/><line x1="9.2" y1="9.2" x2="4.4" y2="4.4"/></svg> · <a href="tuto.html">Mode d’emploi</a></footer>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mdi=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(?!\s)(.+?)\*/g,'<i>$1</i>');
// ciel étoilé
function stars(){const c=$('#stars'),D=devicePixelRatio||1,W=innerWidth,H=innerHeight;c.width=W*D;c.height=H*D;const x=c.getContext('2d');x.scale(D,D);
 for(let i=0,n=Math.round(W*H/2600);i<n;i++){x.globalAlpha=.2+Math.random()*.7;x.fillStyle=Math.random()<.12?'#bcd7ff':'#fff';x.beginPath();x.arc(Math.random()*W,Math.random()*H,.4+Math.random(),0,7);x.fill()}}
stars();let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(stars,250)});
// liste des albums (albums.json est généré automatiquement à chaque enregistrement)
fetch('albums.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(a=>{
 $('#list').innerHTML=a.length?a.map(x=>`<a class="card" href="${encodeURI(x.dir)}/">${x.cover?`<img src="${encodeURI(x.dir)}/${encodeURI(x.cover)}" alt="" loading="lazy" onerror="this.remove()">`:''}<i></i><div><b>${mdi(x.title||x.dir)}</b><small>${esc(x.subtitle||x.author||'')}</small></div></a>`).join(''):'<p class="empty">Aucun album pour l’instant.</p>'
}).catch(()=>{$('#list').innerHTML='<p class="empty">Aucun album pour l’instant : créez-en un dans l’éditeur.</p>'});
</script>
</body>
</html>
