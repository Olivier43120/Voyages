<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Éditeur d’album</title>
<style>
:root{--bg:#0a1a2b;--p:#12293d;--l:#24465f;--m:#aebccb;--b:#3d95e6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#f2f6fa;font:16px/1.5 system-ui,sans-serif;padding:16px 14px 110px}
main{max-width:760px;margin:auto}h1{font-size:26px;margin:6px 0 4px}
section,details{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:14px;margin:12px 0}
summary{cursor:pointer;font-weight:600;font-size:17px}
label{display:block;color:var(--m);font-size:13px;margin:10px 0 3px}
input,textarea,select{width:100%;background:var(--bg);color:inherit;border:1px solid var(--l);border-radius:10px;padding:9px 11px;font:inherit}
textarea{min-height:70px;resize:vertical}
button,.btn{display:inline-block;background:var(--b);color:#fff;border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;margin:0}
.g{background:var(--l)}.r{background:#a33}
.row{display:flex;gap:10px;margin:12px 0 0;padding-top:12px;border-top:1px solid var(--l)}
.row img,.row video{width:84px;height:84px;object-fit:cover;border-radius:10px;flex:none;background:#000}
.row>div{flex:1;min-width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
#bar{position:fixed;left:0;right:0;bottom:0;background:#06121f;border-top:1px solid var(--l);padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;justify-content:center;z-index:5}
a{color:var(--b)}small,.m{color:var(--m);font-size:14px}[hidden]{display:none!important}
</style></head><body><main>
<h1>Éditeur d’album</h1>
<p class="m">Créez vos steps, commentaires et page de garde sans passer par GitHub. <a href="tuto.html#editeur">Mode d’emploi</a></p>
<section id="cx">
 <b>Connexion à GitHub</b>
 <label>Compte</label><input id="o"><label>Dépôt</label><input id="r"><label>Jeton d’accès (voir le mode d’emploi)</label><input id="t" type="password" autocomplete="off">
 <label><input type="checkbox" id="keep" checked style="width:auto"> Mémoriser sur cet appareil</label>
 <p><button id="go">Se connecter</button> <span id="err" class="m"></span></p>
</section>
<div id="app" hidden>
 <section><label>Carnet (un dossier par voyage)</label><select id="al"></select> <p><button class="g" id="mig" hidden>Déplacer ce carnet dans un dossier…</button></p></section>
 <section><b>Album</b>
  <label>Titre</label><input data-a="title"><label>Auteur</label><input data-a="author"><label>Sous-titre (page de garde)</label><input data-a="subtitle">
  <label>Durée du fondu entre photos (secondes, 0 = aucun)</label><input data-a="fade" type="number" min="0" max="2" step="0.05" placeholder="0.64">
  <p><button class="g" id="upv" hidden>Mettre à jour la visionneuse de tous les carnets</button></p>
  <label>Page de garde (image) <span id="cvn"></span></label><input type="file" id="cv" accept="image/*">
 </section>
 <div id="steps"></div>
 <p><button class="g" id="ns">+ Nouveau step</button></p>
</div>
<div id="bar" hidden><span id="st" class="m"></span><button id="sv" disabled>Enregistrer</button></div>
</main>
<script>
const $=s=>document.querySelector(s),B='main',nat=(a,b)=>a.localeCompare(b,0,{numeric:true});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bn=f=>f.replace(/\.[^.]+$/,'').toLowerCase(),isM=f=>/\.(jpe?g|png|webp|heic|mp4|m4v|mov|webm|ogv)$/i.test(f),isV=f=>/\.(mp4|m4v|mov|webm|ogv)$/i.test(f);
let C={},T=new Map,L=new Map,P='',AL=[],S=[],A={},man=null,cover=null,adirty=0,busy=0;
const u=location.host.endsWith('.github.io')?[location.host.split('.')[0],location.pathname.split('/')[1]||'']:['',''];
try{C=JSON.parse(localStorage.ed||sessionStorage.ed||'{}')}catch{}
$('#o').value=C.o||u[0];$('#r').value=C.r||u[1];$('#t').value=C.t||'';
async function api(p,o={}){const r=await fetch(`https://api.github.com/repos/${C.o}/${C.r}${p}`,{method:o.method,headers:{Authorization:'Bearer '+C.t,Accept:'application/vnd.github+json'},body:o.body&&JSON.stringify(o.body)}).catch(e=>{throw new Error('réseau sur '+p.split('?')[0]+' – '+e.message)});
 if(!r.ok)throw new Error(r.status+' '+((await r.json().catch(()=>({}))).message||''));return r.json()}
async function txt(p){const s=L.get(p);if(!s)return'';const b=await api('/git/blobs/'+s);return new TextDecoder().decode(Uint8Array.from(atob(b.content.replace(/\n/g,'')),c=>c.charCodeAt(0)))}
function parse(raw){let mode='',gps='';const k=raw.split(/\r?\n/).filter(l=>{const g=l.match(/^\s*(?:gps|position)\s*:\s*(.+)/i);if(g){gps=g[1].trim();return 0}
 const m=l.match(/^\s*(trajet|vol)\s*:\s*(\S+)/i);if(!m)return 1;const v=m[2].toLowerCase();mode=/^(droit|rectiligne|direct|route|non)/.test(v)?'droit':/^(vol|avion|courbe|oui)/.test(v)?'vol':mode;return 0});return{mode,gps,text:k.join('\n').trim()}}
const ser=(mode,gps)=>(mode?'trajet: '+mode+'\n':'')+(gps?'gps: '+gps+'\n':'');
$('#go').onclick=async()=>{C={o:$('#o').value.trim(),r:$('#r').value.trim(),t:$('#t').value.trim()};
 (($('#keep').checked?localStorage:sessionStorage).ed=JSON.stringify(C));await init()};
async function init(){$('#err').textContent='Connexion…';
 try{const ref=await api('/git/ref/heads/'+B),c=await api('/git/commits/'+ref.object.sha),t=await api('/git/trees/'+c.tree.sha+'?recursive=1');
  T=new Map(t.tree.filter(x=>x.type==='blob').map(x=>[x.path,x.sha]));
  AL=[...new Set([...T.keys()].filter(p=>/^([^/]+\/)?album\.json$/.test(p)).map(p=>p.slice(0,-10)))].sort(nat);if(!AL.includes(P))P=AL[0]??'';
  L=new Map([...T].filter(([p])=>p.startsWith(P)).map(([p,h])=>[p.slice(P.length),h]));A=JSON.parse(await txt('album.json')||'{}');
  man=await fetch(encodeURI(P)+'manifest.json',{cache:'no-cache'}).then(r=>r.json()).catch(()=>null);
  const ids=[...new Set([...L.keys()].map(p=>(p.match(/^(Step\d+)\//i)||[])[1]).filter(Boolean))].sort(nat);
  const old=Object.fromEntries(S.map(s=>[s.id,s.open]));
  S=ids.map(id=>{const f=[...L.keys()].filter(p=>p.startsWith(id+'/')).map(p=>p.slice(id.length+1)).sort(nat),mb=new Set(f.filter(isM).map(bn));
   const ms=man?.steps.find(x=>x.id===id);
   return{id,open:old[id],loaded:0,title:ms?.name||id,desc:'',mode:'',stxt:f.find(x=>/\.txt$/i.test(x)&&!mb.has(bn(x))),
    media:f.filter(isM).map(n=>({name:n,txt:f.find(x=>/\.txt$/i.test(x)&&bn(x)===bn(n)),text:'',mode:'',gps:''}))}});
  cover=null;adirty=0;$('#cx').hidden=1;$('#app').hidden=0;$('#bar').hidden=0;
  document.querySelectorAll('[data-a]').forEach(i=>i.value=A[i.dataset.a]||'');
  const cp=[...L.keys()].find(p=>/^(cover|couverture|garde)\.\w+$/i.test(p));$('#cvn').textContent=cp?'(actuelle : '+cp+')':'(aucune)';
  $('#al').innerHTML=AL.map(p=>`<option value="${esc(p)}"${p===P?' selected':''}>${esc(p?p.slice(0,-1):'(racine)')}</option>`).join('')+'<option value="+">＋ Nouveau carnet…</option>';$('#mig').hidden=P!==''||!T.has('album.json');$('#upv').hidden=!(T.has('viewer.html')&&AL.some(Boolean));
  render();upd()}catch(e){$('#err').textContent='Échec : '+e.message}}
async function loadStep(s){const[a,...b]=await Promise.all([s.stxt?txt(s.id+'/'+s.stxt):'',...s.media.map(m=>m.txt?txt(s.id+'/'+m.txt):'')]);
 const p=parse(a),L=p.text.split('\n'),i=L.findIndex(x=>x.trim());if(i>=0){s.title=L[i].trim();s.desc=L.slice(i+1).join('\n').trim()}s.mode=p.mode;
 s.media.forEach((m,j)=>Object.assign(m,parse(b[j])));s.loaded=1;render()}
const md=(v)=>[['','Trajet : automatique'],['droit','Trajet : droit'],['vol','Trajet : vol (avion)']].map(([a,b])=>`<option value="${a}"${a==v?' selected':''}>${b}</option>`).join('');
const prev=(s,m)=>m.url?(isV(m.name)?`<video src="${m.url}" muted></video>`:`<img src="${m.url}">`):`<img src="${encodeURI(P)}thumbs/${s.id}/${bn(m.name)}.jpg" onerror="this.style.opacity=.2">`;
function render(){$('#steps').innerHTML=S.map((s,i)=>s.del?'':`<details data-i="${i}"${s.open?' open':''}><summary>${S.filter((x,k)=>!x.del&&k<=i).length}. ${esc(s.title)} <small>${s.id}${s.isNew?' · nouveau':''}</small></summary><p><button class="g" data-x="su">↑ Monter le step</button> <button class="g" data-x="sd">↓ Descendre le step</button></p>${!s.loaded?'<p class="m">Chargement…</p>':`
 <label>Titre (**gras** et *italique* acceptés)</label><input data-f="title" value="${esc(s.title)}">
 <label>Texte du step (affiché sur la 1re photo)</label><textarea data-f="desc">${esc(s.desc)}</textarea>
 <label>Trajet depuis le step précédent</label><select data-f="mode">${md(s.mode)}</select>
 ${s.media.map((m,j)=>m.del?'':`<div class="row" data-j="${j}">${prev(s,m)}<div><b>${esc(m.name)}</b>${m.file?' <small>nouveau</small>':''}<textarea data-m="text" placeholder="Commentaire (Markdown : **gras**, *italique*)">${esc(m.text)}</textarea>
 <div class="grid"><select data-m="mode">${md(m.mode)}</select><input data-m="gps" placeholder="GPS : 40.74, -73.98" value="${esc(m.gps)}"></div><button class="g" data-x="mu">↑</button> <button class="g" data-x="md">↓</button> <button class="r" data-x="dm">Supprimer</button></div></div>`).join('')}
 <p><label class="btn g">+ Photos / vidéos<input type="file" multiple accept="image/*,video/*" hidden data-x="add"></label> <button class="r" data-x="ds">Supprimer le step</button></p>`}</details>`).join('')}
const dirty=()=>(adirty?1:0)+(cover?1:0)+(S.ord?1:0)+S.filter(s=>s.reord).length+S.filter(s=>s.del||s.dirty||s.isNew).length+S.reduce((n,s)=>n+s.media.filter(m=>m.del||m.dirty||m.file).length,0);
function upd(){const n=dirty();$('#sv').disabled=busy||!n;$('#sv').textContent=n?`Enregistrer (${n})`:'Enregistrer';if(!busy)$('#st').textContent=n?'Modifications non enregistrées':''}
onbeforeunload=e=>dirty()&&!busy?(e.preventDefault(),''):undefined;
document.addEventListener('input',e=>{const t=e.target,d=t.closest('details');
 if(t.dataset.a){A[t.dataset.a]=t.value;adirty=1}else if(d&&t.dataset.f){const s=S[+d.dataset.i];s[t.dataset.f]=t.value;s.dirty=1}
 else if(d&&t.dataset.m){const m=S[+d.dataset.i].media[+t.closest('.row').dataset.j];m[t.dataset.m]=t.value;m.dirty=1}upd()});
$('#cv').onchange=e=>{cover=e.target.files[0]||null;upd()};
$('#steps').addEventListener('toggle',e=>{const s=S[+e.target.dataset.i];if(s){s.open=e.target.open;if(s.open&&!s.loaded)loadStep(s)}},true);
$('#steps').addEventListener('click',e=>{const x=e.target.dataset.x,d=e.target.closest('details'),s=d&&S[+d.dataset.i];
 if(x==='ds'&&confirm('Supprimer ce step et toutes ses photos ?')){s.del=1;render();upd()}
 if(x==='su'||x==='sd'){const i=+d.dataset.i,dir=x==='su'?-1:1;let k=i+dir;while(S[k]&&S[k].del)k+=dir;if(S[k]){[S[i],S[k]]=[S[k],S[i]];S.ord=1;render();upd()}}
 if(x==='mu'||x==='md'){const j=+e.target.closest('.row').dataset.j,dir=x==='mu'?-1:1;let k=j+dir;while(s.media[k]&&s.media[k].del)k+=dir;if(s.media[k]){[s.media[j],s.media[k]]=[s.media[k],s.media[j]];s.reord=1;render();upd()}}
 if(x==='dm'){s.media[+e.target.closest('.row').dataset.j].del=1;render();upd()}});
$('#steps').addEventListener('change',e=>{if(e.target.dataset.x!=='add')return;const s=S[+e.target.closest('details').dataset.i];
 let n=Math.max(0,...s.media.map(m=>+(m.name.match(/(\d+)/)||[0,0])[1]));
 for(const f of e.target.files){const ext=(f.name.split('.').pop()||'jpg').toLowerCase();s.media.push({name:`img${String(++n).padStart(3,'0')}.${ext}`,file:f,url:URL.createObjectURL(f),text:'',mode:'',gps:''})}render();upd()});
$('#ns').onclick=()=>{const n=Math.max(0,...S.map(s=>+s.id.slice(4)))+1;S.push({id:'Step'+n,isNew:1,loaded:1,open:1,title:'',desc:'',mode:'',media:[]});render();upd();scrollTo(0,1e6)};
const b64=f=>new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(f)});
$('#sv').onclick=async()=>{const E=[],del=p=>L.has(p)&&E.push({path:p,del:1});busy=1;upd();
 const ttl=(s)=>(s.title||s.id)+'\n'+ser(s.mode)+s.desc;
 if(adirty)E.push({path:'album.json',text:JSON.stringify(A,null,1)});
 if(cover){[...L.keys()].filter(p=>/^(cover|couverture|garde)\.\w+$/i.test(p)).forEach(del);E.push({path:'cover.'+cover.name.split('.').pop().toLowerCase(),file:cover})}
 for(const s of S){if(s.del){[...L.keys()].filter(p=>p.startsWith(s.id+'/')).forEach(del);continue}
  if(s.loaded&&(s.dirty||s.isNew))E.push({path:`${s.id}/${s.stxt||'nom.txt'}`,text:ttl(s)});
  if(s.reord){const fin=new Map(),old=[];
   s.media.forEach(m=>{if(!m.file){old.push(`${s.id}/${m.name}`);m.txt&&old.push(`${s.id}/${m.txt}`)}});
   s.media.filter(m=>!m.del).forEach((m,i)=>{const nn=`img${String(i+1).padStart(3,'0')}.${m.name.split('.').pop().toLowerCase()}`,tp=`${s.id}/${bn(nn)}.txt`;
    fin.set(`${s.id}/${nn}`,m.file?{file:m.file}:{sha:L.get(`${s.id}/${m.name}`)});
    if(m.dirty||m.file){const c=ser(m.mode,m.gps.trim())+m.text;if(c.trim())fin.set(tp,{text:c})}
    else if(m.txt)fin.set(tp,{sha:L.get(`${s.id}/${m.txt}`)})});
   old.forEach(p=>fin.has(p)||del(p));fin.forEach((v,path)=>E.push({path,...v}))}
  else for(const m of s.media){const tp=`${s.id}/${m.txt||bn(m.name)+'.txt'}`;
   if(m.del){if(!m.file){del(`${s.id}/${m.name}`);del(tp)}continue}
   if(m.file)E.push({path:`${s.id}/${m.name}`,file:m.file});
   if(m.dirty||m.file){const c=ser(m.mode,m.gps.trim())+m.text;c.trim()?E.push({path:tp,text:c}):del(tp)}}}
 try{if(E.length)await commit(E,'Édition via l’éditeur d’album');if(S.ord)await reorderSteps();busy=0;await init();$('#st').textContent='Enregistré. L’album se met à jour dans 1 à 3 minutes.'}
 catch(e){busy=0;upd();$('#st').textContent='Échec : '+e.message}};
async function reorderSteps(){const ref=await api('/git/ref/heads/'+B),cm=await api('/git/commits/'+ref.object.sha);
 let tr=await api('/git/trees/'+cm.tree.sha);if(P){const d=tr.tree.find(x=>x.path===P.slice(0,-1));tr=await api('/git/trees/'+d.sha)}
 const dir=Object.fromEntries(tr.tree.filter(x=>x.type==='tree').map(x=>[x.path,x.sha])),act=S.filter(s=>!s.del),E=[],to=new Set();
 act.forEach((s,k)=>{const nid='Step'+(k+1);to.add(nid);if(nid!==s.id&&dir[s.id])E.push({path:nid,sha:dir[s.id],tree:1})});
 act.forEach(s=>{if(!to.has(s.id)&&dir[s.id])E.push({path:s.id,del:1,tree:1})});
 if(E.length)await commit(E,'Réorganisation des steps')}
async function commit(E,msg,abs){let k=0;const tree=[],pre=abs?'':P;
 for(const e of E){$('#st').textContent=`Envoi ${++k}/${E.length}…`;const T0=e.tree?{mode:'040000',type:'tree'}:{mode:'100644',type:'blob'};
  if(e.del){tree.push({path:pre+e.path,...T0,sha:null});continue}
  let sha=e.sha;if(!sha){const c=e.file?await b64(e.file):btoa(String.fromCharCode(...new TextEncoder().encode(e.text)));
   sha=(await api('/git/blobs',{method:'POST',body:{content:c,encoding:'base64'}})).sha}
  tree.push({path:pre+e.path,...T0,sha})}
 const ref=await api('/git/ref/heads/'+B),cm=await api('/git/commits/'+ref.object.sha);
 const nt=await api('/git/trees',{method:'POST',body:{base_tree:cm.tree.sha,tree}});
 const nc=await api('/git/commits',{method:'POST',body:{message:msg,tree:nt.sha,parents:[ref.object.sha]}});
 await api('/git/refs/heads/'+B,{method:'PATCH',body:{sha:nc.sha}})}
// ---- carnets (un dossier par voyage)
const HOME=`<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mes carnets</title><style>body{margin:0;background:#0a1a2b;color:#fff;font:17px system-ui,sans-serif;padding:28px 18px}main{max-width:720px;margin:auto}a{display:flex;gap:14px;align-items:center;background:#12293d;border:1px solid #24465f;border-radius:18px;padding:12px;margin:12px 0;color:inherit;text-decoration:none}img{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#234}small{color:#aebccb}</style></head><body><main><h1>Mes carnets de voyage</h1><div id="l"></div></main><script>const e=t=>String(t||'').replace(/</g,'&lt;');fetch('albums.json',{cache:'no-cache'}).then(r=>r.json()).then(a=>{l.innerHTML=a.map(x=>'<a href="'+encodeURI(x.dir)+'/"><img src="'+encodeURI(x.dir)+'/'+encodeURI(x.cover||'')+'" onerror="this.remove()"><div><b>'+e(x.title||x.dir)+'</b><br><small>'+e(x.subtitle||x.author)+'</small></div></a>').join('')||'Aucun carnet.'}).catch(()=>l.textContent='Aucun carnet.')<\/script></body></html>`;
const dirName=m=>(prompt(m)||'').trim().replace(/[\\/:*?"<>|]/g,'');
const viewerSha=()=>T.get('viewer.html')||AL.map(p=>T.get(p+'index.html')).find(Boolean);
async function newCarnet(){const n=dirName('Nom du dossier du nouveau carnet (ex. Japon2027) :');if(!n)return;
 if([...T.keys()].some(p=>p.startsWith(n+'/'))){alert('Ce dossier existe déjà.');return}
 const v=viewerSha();if(!v){alert('Visionneuse introuvable (index.html ou viewer.html).');return}
 try{await commit([{path:n+'/index.html',sha:v},{path:n+'/album.json',text:JSON.stringify({title:n,author:A.author||'',subtitle:''},null,1)}],'Nouveau carnet '+n,1);P=n+'/';S=[];await init();$('#st').textContent='Carnet créé. Ajoutez vos steps, puis enregistrez.'}
 catch(e){$('#st').textContent='Échec : '+e.message}}
async function migrate(){const n=dirName('Dossier de destination pour ce carnet (ex. NewYork) :');if(!n)return;
 if(!confirm('Déplacer tout le carnet actuel dans « '+n+' » ? La page d’accueil du site deviendra la liste des carnets.'))return;
 try{$('#st').textContent='Préparation…';
  const ref=await api('/git/ref/heads/'+B),cm=await api('/git/commits/'+ref.object.sha),rt=await api('/git/trees/'+cm.tree.sha);
  const keep=x=>/^(Step\d+|thumbs|medium)$/i.test(x)||/^(album|manifest)\.json$|^index\.html$|^(cover|couverture|garde)\.\w+$/i.test(x),E=[];
  if(rt.tree.some(x=>x.path===n)){alert('Ce dossier existe déjà.');return}
  for(const x of rt.tree){if(!keep(x.path))continue;const t=x.type==='tree';E.push({path:n+'/'+x.path,sha:x.sha,tree:t});if(x.path!=='index.html')E.push({path:x.path,del:1,tree:t})}
  const ix=rt.tree.find(x=>x.path==='index.html');if(ix)E.push({path:'viewer.html',sha:ix.sha});E.push({path:'index.html',text:HOME});
  await commit(E,'Déplacement du carnet dans '+n,1);P=n+'/';S=[];await init();$('#st').textContent='Carnet déplacé. Patientez 1 à 3 minutes.'}
 catch(e){$('#st').textContent='Échec : '+e.message}}
$('#mig').onclick=migrate;
$('#upv').onclick=async()=>{if(!confirm('Remplacer l’index.html de chaque carnet par viewer.html ?'))return;
 try{await commit(AL.filter(Boolean).map(p=>({path:p+'index.html',sha:T.get('viewer.html')})),'Mise à jour de la visionneuse',1);$('#st').textContent='Visionneuse mise à jour. Patientez 1 à 3 minutes.'}catch(e){$('#st').textContent='Échec : '+e.message}};
$('#al').onchange=async e=>{if(e.target.value==='+'){e.target.value=P;return newCarnet()}
 if(dirty()&&!confirm('Abandonner les modifications non enregistrées ?')){e.target.value=P;return}P=e.target.value;S=[];await init()};
if(C.t&&C.o&&C.r)init();
</script></body></html>
