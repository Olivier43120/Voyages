<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Album de voyage</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--fade:.64s;--night:#0a1a2b;--btn:#143042;--blue:#3d95e6;--ink:#fff;--mut:#b9c4cf;--side:440px}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--night);color:var(--ink);font-family:Outfit,system-ui,sans-serif;overflow:hidden}
#map{position:fixed;inset:0;background:var(--night)}
.leaflet-container{background:var(--night);font-family:inherit}
.leaflet-control-attribution{background:rgba(0,0,0,.35)!important;color:#aab!important;font-size:9px}
.leaflet-control-attribution a{color:#ccd!important}
/* pastilles photo */
.pin{position:relative;width:48px;height:48px;border-radius:50%;border:3px solid #fff;overflow:hidden;background:#345;box-shadow:0 2px 8px #0008;transition:transform .25s}
.pin img{width:100%;height:100%;object-fit:cover;display:block}
.pin.on{transform:scale(1.25);border-color:var(--blue);box-shadow:0 0 0 6px #3d95e655,0 2px 10px #000a}
.plane{filter:drop-shadow(0 1px 3px #000c)}.plane div{width:26px;height:26px}.plane svg{display:block}
.pin.v:after{content:"\25B6";position:absolute;inset:0;display:grid;place-items:center;font-size:15px;color:#fff;background:#0003;text-shadow:0 0 6px #000}
.pin.sm{width:38px;height:38px;border-width:2px}
/* en-tête & boutons */
#top{position:fixed;top:max(14px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:0 16px;pointer-events:none;z-index:500}
#top>*{pointer-events:auto}
.rb{flex:none;width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--btn);color:#fff;cursor:pointer;font-size:20px;box-shadow:0 2px 10px #0006}
#back{background:#fff;color:var(--night);visibility:hidden}
body.inview #back{visibility:visible}
#ttl{flex:1;min-width:0;padding:0 6px;text-align:center;text-shadow:0 1px 8px #000}
#ttl small{display:block;font-size:13px;font-weight:500;opacity:.9}
#ttl b{font-size:24px;font-weight:500}
/* rail de steps */
#daybar{position:fixed;left:16px;right:16px;bottom:calc(244px + env(safe-area-inset-bottom));height:6px;border-radius:3px;background:rgba(255,255,255,.22);z-index:495;pointer-events:none}
#dbf{position:absolute;left:0;top:0;height:100%;width:0;border-radius:3px;background:rgba(61,149,230,.88);transition:width .6s cubic-bezier(.2,.8,.2,1)}
#dbp{position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;gap:6px;align-items:center;padding:6px 13px 6px 10px;border-radius:15px;background:rgba(10,26,43,.52);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-weight:500;font-size:16px;white-space:nowrap;box-shadow:0 1px 8px #0005;transition:left .6s cubic-bezier(.2,.8,.2,1)}
#dbp svg{width:17px;height:17px;fill:#fff}#dbp svg.pl{transform:rotate(90deg)}
body.inview #daybar{display:none}
#rail{position:fixed;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom));height:200px;display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 calc(50% - 130px);z-index:500;scrollbar-width:none}
#rail::-webkit-scrollbar{display:none}
.card{position:relative;flex:0 0 260px;border-radius:30px;overflow:hidden;scroll-snap-align:center;cursor:pointer;background:#234;border:2px solid transparent;transition:border-color .2s}
.card.on{border-color:#ffffff66}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card i{position:absolute;inset:0;background:linear-gradient(transparent 40%,#000b)}
.card div{position:absolute;left:18px;right:18px;bottom:14px}
.card b{display:block;font-size:21px;font-weight:500;line-height:1.15}
.card small{color:var(--mut);font-size:14px}
body.inview #rail{display:none}
/* visionneuse */
#viewer{position:fixed;left:0;right:0;bottom:0;top:240px;border-radius:30px 30px 0 0;overflow:hidden;background:#000;z-index:600;transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1),top .4s cubic-bezier(.2,.8,.2,1),border-radius .4s;touch-action:none;user-select:none}
#viewer.on{transform:none}
#viewer.full{top:0;border-radius:0}
#viewer.full #prog{top:calc(14px + env(safe-area-inset-top))}
#viewer>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:3}
.sl{position:absolute;inset:0;opacity:0;transition:opacity var(--fade)}
.sl.old{opacity:1;z-index:1}.sl.on{opacity:1;z-index:2}
.sl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none}
.sl img.bg{inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);filter:blur(28px) brightness(.55) saturate(1.2);transform:translateZ(0)}
b b,#cap h2 b,#ttl b b{font-weight:700}
#shade{position:absolute;z-index:4;inset:0;pointer-events:none;background:linear-gradient(#0008,transparent 16%,transparent 64%,#000c)}
#prog{position:absolute;top:14px;left:18px;right:18px;display:flex;gap:8px;z-index:6}
#prog i{flex:1;height:3px;border-radius:3px;background:#fff5;overflow:hidden}
#prog i.d:after{content:"";display:block;height:100%;background:#fff}
#cap{position:absolute;z-index:5;left:20px;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));pointer-events:none}
#cap h2{font-size:22px;font-weight:500;line-height:1.15;text-shadow:0 2px 12px #000}
#cap p.m{margin:6px 0 8px;font-size:13px;font-weight:500;opacity:.92}
#cap .d p{margin:0 0 .6em}#cap .d b{font-weight:700}#cap .d{color:#e4e9ee;font-size:15px;line-height:1.5;max-width:60ch}
#vc{position:absolute;top:32px;right:16px;display:flex;gap:8px;z-index:7}
#vc[hidden]{display:none}
#viewer.full #vc{top:calc(32px + env(safe-area-inset-top))}
#vc button{width:38px;height:38px;border-radius:50%;border:0;background:#0007;backdrop-filter:blur(10px);color:#fff;font-size:15px;cursor:pointer}
.nv{display:none}
/* barre latérale (ordinateur) */
#side,#split{display:none}
@media(min-width:900px){
 #map{left:var(--side)}
 #side{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:var(--side);background:#0c2033;z-index:550;padding:26px 22px 0;overflow:hidden}
 #side h1{font-size:30px;font-weight:700}
 #side .by{color:var(--mut);margin:2px 0 18px}
 #stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
 #stats div{background:var(--btn);border-radius:16px;padding:12px 6px;text-align:center}
 #stats b{display:block;font-size:22px}#stats small{color:var(--mut);font-size:12px}
 #list{flex:1;overflow-y:auto;margin:0 -22px;padding:0 22px 22px;scrollbar-width:thin}
 .row{display:flex;gap:14px;align-items:center;padding:10px;border-radius:18px;cursor:pointer}
 .row:hover,.row.on{background:var(--btn)}
 .row img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid #fff}
 .row b{display:block;font-weight:500}.row small{color:var(--mut)}
 #split{display:block;position:fixed;top:0;bottom:0;left:calc(var(--side) - 6px);width:12px;cursor:col-resize;z-index:700;touch-action:none;outline:none}
 #split:after{content:"";position:absolute;left:4px;top:50%;width:4px;height:56px;margin-top:-28px;border-radius:4px;background:#ffffffaa;opacity:0;transition:opacity .2s}
 #split:hover:after,#split:focus-visible:after,body.dragging #split:after{opacity:1}
 body.dragging{cursor:col-resize;user-select:none}
 .nv{display:grid;place-items:center;position:absolute;top:50%;width:42px;height:42px;margin-top:-21px;border-radius:50%;border:0;background:#0007;color:#fff;font-size:26px;line-height:1;cursor:pointer;z-index:7;opacity:0;transition:opacity .2s}
 #viewer:hover .nv{opacity:1}#prev{left:12px}#next{right:12px}
 #top{left:var(--side);width:calc(100% - var(--side))}
 #ttl{visibility:hidden}
 #viewer{top:0;bottom:0;right:auto;width:var(--side);border-radius:0}
 body.inview #side{visibility:hidden}
 #daybar{left:calc(var(--side) + 16px)}
 #rail{left:var(--side);padding:0 calc(50% - 130px - var(--side)/2)}
 body.inview #map{left:var(--side)}
 #viewer{transform:translateX(-105%)}#viewer.on{transform:none}
}
#cover{position:fixed;inset:0;z-index:2000;background:#000;cursor:pointer;touch-action:none;transition:transform .85s cubic-bezier(.7,0,.2,1),opacity .85s}
#cover.out{transform:translateY(-100%);opacity:.5}
#cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cvs{position:absolute;inset:0;background:linear-gradient(#0006,transparent 25%,transparent 42%,#000d)}
#cvt{position:absolute;left:28px;right:28px;bottom:calc(48px + env(safe-area-inset-bottom));max-width:720px}
#cvt small{font-size:15px;letter-spacing:.14em;text-transform:uppercase;opacity:.92}
#cvt h1{font-size:clamp(38px,9vw,72px);line-height:1.02;font-weight:700;text-shadow:0 2px 20px #000a;margin:6px 0 0}
#cvt p{font-size:19px;color:#e4e9ee;margin:10px 0 0}
#cvb{display:inline-block;margin-top:26px;padding:14px 26px;border-radius:30px;background:#fff;color:var(--night);font-weight:600;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
#err{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3000;max-width:min(520px,90vw);background:#12293d;border:1px solid #24465f;border-radius:18px;padding:18px 22px;line-height:1.55;text-align:center;box-shadow:0 8px 30px #0008}
#err a{color:var(--blue)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}#cvb{animation:none}}
</style>
</head>
<body>
<div id="map"></div>
<div id="split" role="separator" aria-orientation="vertical" aria-label="Redimensionner le panneau" tabindex="0" title="Glisser pour redimensionner (double-clic : réinitialiser)"></div>
<aside id="side"><h1 id="h1"></h1><div class="by" id="by"></div><div id="stats"></div><div id="list"></div></aside>
<header id="top">
 <button class="rb" id="back" aria-label="Retour">&#8249;</button>
 <div id="ttl"><small id="who"></small><b id="place"></b></div>
 <button class="rb" id="lay" aria-label="Changer de fond de carte"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg></button>
</header>
<div id="daybar" hidden><i id="dbf"></i><span id="dbp"><svg viewBox="0 0 24 24"></svg><b id="dbt"></b></span></div>
<section id="rail"></section>
<div id="err" hidden></div>
<section id="viewer">
 <div class="sl" id="s0"><img class="bg" alt="" draggable="false"><img class="ph" alt="" draggable="false"></div><div class="sl" id="s1"><img class="bg" alt="" draggable="false"><img class="ph" alt="" draggable="false"></div><video id="vd" playsinline hidden></video><div id="shade"></div><div id="prog"></div>
 <div id="cap"><h2 id="t"></h2><p class="m" id="m"></p><div class="d" id="d"></div></div>
 <button id="prev" class="nv" aria-label="Précédent">&#8249;</button><button id="next" class="nv" aria-label="Suivant">&#8250;</button>
 <div id="vc" hidden><button id="pp"></button><button id="mu"></button></div>
</section>
<section id="cover" hidden><img id="cv" alt=""><div id="cvs"></div>
 <div id="cvt"><small id="cva"></small><h1 id="cvh"></h1><p id="cvp"></p><span id="cvb">Ouvrir l’album &#8250;</span></div></section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=s=>document.querySelector(s), DESK=matchMedia('(min-width:900px)');
const SAT=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery &copy; Esri'});
const PLAN=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'});
const M=L.map('map',{zoomControl:false,center:[30,0],zoom:2,layers:[SAT]}), G=L.layerGroup().addTo(M);
let steps=[],cur=0,view=null,sat=true;
const fmt=d=>d?new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):'';
const md=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*\*(.+?)\*\*/gs,'<b>$1</b>').replace(/\*(?!\s)(.+?)\*/gs,'<i>$1</i>').split(/\n\s*\n/).filter(x=>x.trim()).map(x=>'<p>'+x.trim().replace(/\n/g,'<br>')+'</p>').join('');
const VPH='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><rect width="10" height="10" fill="#1b3a55"/><path d="M4 3.2v3.6L7 5z" fill="#fff"/></svg>');
const th=p=>p.thumb||(p.type==='video'?VPH:p.src);
const lbl=s=>{const v=s.photos.filter(p=>p.type==='video').length,n=s.photos.length-v;return [n&&n+' photo'+(n>1?'s':''),v&&v+' vidéo'+(v>1?'s':'')].filter(Boolean).join(' · ')};
const mdi=t=>md(t||'').replace(/^<p>|<\/p>$/g,'').replace(/<\/p><p>/g,' ');
const loc=p=>p.lat!=null?[p.lat,p.lng]:null;
const km=(a,b)=>{const r=x=>x*Math.PI/180,h=Math.sin(r(b[0]-a[0])/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(r(b[1]-a[1])/2)**2;return 12742*Math.asin(Math.sqrt(h))};
const pad=()=>{const h=innerHeight;
 if(view)return DESK.matches?{paddingTopLeft:[60,90],paddingBottomRight:[60,60]}:{paddingTopLeft:[50,90],paddingBottomRight:[50,h-240+20]};
 return {paddingTopLeft:[60,100],paddingBottomRight:[60,DESK.matches?270:260]}};
const pin=(p,c)=>L.marker(loc(p),{icon:L.divIcon({className:'',iconSize:[48,48],html:`<div class="pin ${c}${p.type==='video'?' v':''}"><img src="${th(p)}" alt=""></div>`})});
const dash=pts=>L.polyline(pts,{color:'#fff',weight:2.5,dashArray:'7 8',opacity:.9});

// Trajets : trait droit en dessous de FLIGHT_KM, sinon arc courbe + avions régulièrement espacés
const FLIGHT_KM=500,PLANE_EVERY=1800,PM=L.Projection.SphericalMercator;
const PLANE='<svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M12 2c.8 0 1.5.7 1.5 1.5V9l8 5v2l-8-2.5V19l2 1.5V22l-3.5-1L8.5 22v-1.5l2-1.5v-5.5L2.5 16v-2l8-5V3.5C10.5 2.7 11.2 2 12 2z"/></svg>';
function route(pts,modes){const out=[];
 for(let i=1;i<pts.length;i++){const a=pts[i-1],b=[pts[i][0],pts[i][1]],d=km(a,b);
  const mo=modes&&modes[i];if(mo==='straight'||(mo!=='flight'&&d<FLIGHT_KM)){dash([a,b]).addTo(G);out.push(a,b);continue}
  if(Math.abs(b[1]-a[1])>180)b[1]+=b[1]<a[1]?360:-360;
  const P0=PM.project(L.latLng(a)),P1=PM.project(L.latLng(b)),dx=P1.x-P0.x,dy=P1.y-P0.y;
  let nx=-dy,ny=dx;if(ny<0){nx=-nx;ny=-ny}
  const C={x:(P0.x+P1.x)/2+nx*.28,y:(P0.y+P1.y)/2+ny*.28};
  const at=t=>L.point((1-t)**2*P0.x+2*(1-t)*t*C.x+t*t*P1.x,(1-t)**2*P0.y+2*(1-t)*t*C.y+t*t*P1.y);
  const arc=[];for(let k=0;k<=48;k++)arc.push(PM.unproject(at(k/48)));
  dash(arc).addTo(G);out.push(...arc);
  const n=Math.max(1,Math.round(d/PLANE_EVERY));
  for(let k=0;k<n;k++){const t=(k+.5)/n,A=at(Math.max(0,t-.01)),B=at(Math.min(1,t+.01)),rot=90-Math.atan2(B.y-A.y,B.x-A.x)*180/Math.PI;
   L.marker(PM.unproject(at(t)),{interactive:false,keyboard:false,zIndexOffset:-500,icon:L.divIcon({className:'plane',iconSize:[26,26],iconAnchor:[13,13],html:`<div style="transform:rotate(${rot}deg)">${PLANE}</div>`})}).addTo(G)}
 }return out}

function fail(msg){const e=$('#err');e.hidden=false;e.innerHTML='<b></b><br><small>Aide : <a href="tuto.html#depannage">tutoriel, section Dépannage</a></small>';e.firstChild.textContent=msg}
fetch('manifest.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('manifest.json introuvable (erreur HTTP '+r.status+'). L’action GitHub a-t-elle bien tourné ?');return r.json()})
 .then(init).catch(e=>{console.error(e);fail(/^manifest/.test(e.message)?e.message:'Erreur dans l’album : '+e.message)});

function init(m){
 steps=m.steps.filter(s=>s.photos.length);
 steps.forEach(s=>{let last=s.photos.find(loc);last=last&&loc(last);s.photos.forEach(p=>{if(p.lat==null&&last)[p.lat,p.lng]=last;else if(p.lat!=null)last=[p.lat,p.lng]});s.loc=s.photos.find(loc)&&loc(s.photos.find(loc))});
 computeDays();document.title=m.title||'Album';if(m.fade!==undefined&&m.fade!==''&&m.fade!==null&&isFinite(+m.fade))document.documentElement.style.setProperty('--fade',(+m.fade)+'s');$('#h1').textContent=$('#place').textContent=m.title||'Mon voyage';
 $('#by').textContent=m.author||'';$('#who').textContent=m.author||'';
 // statistiques
 const all=steps.flatMap(s=>s.photos),pts=all.filter(loc).map(loc);let d=0;for(let i=1;i<pts.length;i++)d+=km(pts[i-1],pts[i]);
 const days=new Set(all.map(p=>(p.date||'').slice(0,10)).filter(Boolean)).size;
 $('#stats').innerHTML=[[steps.length,'steps'],[all.length,all.some(p=>p.type==='video')?'médias':'photos'],[Math.round(d).toLocaleString('fr-FR'),'km'],[days||'–','jours']].map(([a,b])=>`<div><b>${a}</b><small>${b}</small></div>`).join('');
 $('#list').innerHTML=steps.map((s,i)=>`<div class="row" data-i="${i}"><img src="${th(s.photos[0])}" alt=""><div><b>${mdi(s.name)}</b><small>${fmt(s.photos[0].date)} · ${lbl(s)}</small></div></div>`).join('');
 $('#rail').innerHTML=steps.map((s,i)=>`<article class="card" data-i="${i}"><img src="${th(s.photos[0])}" alt="" loading="lazy"><i></i><div><b>${mdi(s.name)}</b><small>${fmt(s.photos[0].date)} · ${lbl(s)}</small></div></article>`).join('');
 $('#list').onclick=e=>{const r=e.target.closest('.row');if(r)openStep(+r.dataset.i)};
 $('#rail').onclick=e=>{const c=e.target.closest('.card');if(c)openStep(+c.dataset.i)};
 let t;$('#rail').onscroll=()=>{clearTimeout(t);t=setTimeout(()=>{const r=$('#rail').getBoundingClientRect(),mid=r.left+r.width/2;let b=0,bd=1e9;
  document.querySelectorAll('.card').forEach((c,i)=>{const q=c.getBoundingClientRect(),dd=Math.abs(q.left+q.width/2-mid);if(dd<bd){bd=dd;b=i}});if(b!==cur)setActive(b,false)},90)};
 if(!openCover(m))setActive(0,false);
}
// Jour du voyage (d'après la date de la 1re photo datée de chaque step) et barre « Jour N » façon Polarsteps
let tot=1;
const WALK='<path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7z"/>';
const FLY='<path d="M12 2c.8 0 1.5.7 1.5 1.5V9l8 5v2l-8-2.5V19l2 1.5V22l-3.5-1L8.5 22v-1.5l2-1.5v-5.5L2.5 16v-2l8-5V3.5C10.5 2.7 11.2 2 12 2z"/>';
function computeDays(){
 const t=steps.map(s=>{const p=s.photos.find(x=>x.date);return p?Date.UTC(+p.date.slice(0,4),+p.date.slice(5,7)-1,+p.date.slice(8,10))/864e5:null});
 const d0=Math.min(...t.filter(x=>x!=null));let last=1;
 steps.forEach((s,i)=>{s.day=t[i]!=null?Math.round(t[i]-d0)+1:(isFinite(d0)?last:0);last=s.day||last});
 tot=Math.max(1,...steps.map(s=>s.day||0))}
function showDay(i){const s=steps[i],B=$('#daybar');if(!s||!s.day){B.hidden=true;return}B.hidden=false;
 $('#dbt').textContent='Jour '+s.day;
 const pv=steps.slice(0,i).reverse().find(x=>x.loc),fl=pv&&s.loc&&(s.mode==='flight'||(s.mode!=='straight'&&km(pv.loc,s.loc)>=FLIGHT_KM));
 const ic=$('#dbp svg');ic.innerHTML=fl?FLY:WALK;ic.classList.toggle('pl',!!fl);
 const x=(tot>1?(s.day-1)/(tot-1):1)*Math.max(0,B.clientWidth-$('#dbp').offsetWidth);$('#dbp').style.left=x+'px';$('#dbf').style.width=x+'px'}
addEventListener('resize',()=>steps.length&&showDay(cur));
function openCover(m){
 if(!m.cover)return false;
 const C=$('#cover');let done=false,y0=0;
 $('#cv').src=m.cover.src;$('#cva').textContent=m.author||'';$('#cvh').textContent=m.title||'Mon voyage';$('#cvp').textContent=m.subtitle||'';
 C.hidden=false;
 const go=()=>{if(done)return;done=true;removeEventListener('keydown',k);C.classList.add('out');setTimeout(()=>{C.hidden=true},900);M.invalidateSize();setActive(0,false)};
 const k=e=>{if(['Enter',' ','ArrowRight','ArrowUp'].includes(e.key)){e.preventDefault();go()}};
 addEventListener('keydown',k);C.onclick=go;
 C.addEventListener('pointerdown',e=>y0=e.clientY);C.addEventListener('pointerup',e=>{if(y0-e.clientY>40)go()});
 return true;
}
function homeMap(fit){
 G.clearLayers();const vs=steps.filter(s=>s.loc),pts=vs.map(s=>s.loc);
 route(pts,vs.map(s=>s.mode));
 steps.forEach((s,i)=>{if(!s.loc)return;pin(s.photos[0],i===cur?'on':'sm').on('click',()=>openStep(i)).addTo(G)});
 const s=steps[cur];if(fit&&s.loc)M.flyTo(s.loc,10,{duration:1.2});
}
function setActive(i,scroll){cur=i;
 document.querySelectorAll('.card,.row').forEach(e=>e.classList.toggle('on',+e.dataset.i===i));
 $('#place').innerHTML=mdi(steps[i].name);showDay(i);
 if(scroll)document.querySelector(`.card[data-i="${i}"]`).scrollIntoView({inline:'center',behavior:'smooth',block:'nearest'});
 homeMap(true);
}
function openStep(i,j=0){cur=i;view={i,j};full=false;$('#viewer').classList.remove('full');document.body.classList.add('inview');$('#viewer').classList.add('on');
 const s=steps[i];$('#prog').innerHTML=s.photos.map(()=>'<i></i>').join('');
 G.clearLayers();const gp=s.photos.filter(loc),pts=gp.map(loc);
 const rp=route(pts,gp.map(p=>p.mode||s.mode));
 s.photos.forEach((p,k)=>{if(loc(p))pin(p,'sm').on('click',e=>{L.DomEvent.stop(e);show(k)}).addTo(G)});
 setTimeout(()=>{M.invalidateSize();if(pts.length)M.fitBounds(L.latLngBounds(pts.concat(rp)),{...pad(),maxZoom:17,duration:1})},60);
 resetSlides();show(j,true);
}
const VD=$('#vd'),SL=[$('#s0'),$('#s1')],cp=()=>SL[si].querySelector('.ph'),cb=()=>SL[si].querySelector('.bg');let si=0,tok=0;
function fit(el,w,h,bw,bh){if(!bw){const b=$('#viewer').getBoundingClientRect();bw=b.width;bh=b.height}if(!w||!h||!bw)return;
 const ia=w/h,ba=bw/bh,vis=ia>ba?ba/ia:ia/ba;el.style.objectFit=vis>=.8?'cover':'contain'}
function bgVis(){cb().style.visibility=(VD.hidden?cp():VD).style.objectFit==='contain'?'visible':'hidden'}
function refit(bw,bh){const im=cp();fit(im,im.naturalWidth,im.naturalHeight,bw,bh);fit(VD,VD.videoWidth,VD.videoHeight,bw,bh);bgVis()}
let muted=false,full=false,mapT;
const upd=()=>{$('#mu').textContent=VD.muted?'\u{1F507}':'\u{1F50A}';$('#pp').innerHTML=VD.paused?'&#9654;':'&#10074;&#10074;'};
function stopVid(){VD.pause();VD.removeAttribute('src');VD.load()}
const keep=[];
function pre(p){if(!p||p.type==='video')return;const u=p.med||p.src;if(keep.some(k=>k.u===u))return;const i=new Image();i.src=u;i.decode&&i.decode().catch(()=>{});keep.push({u,i});if(keep.length>8)keep.shift()}
function resetSlides(){SL.forEach(S=>{S.className='sl';S.querySelectorAll('img').forEach(i=>i.removeAttribute('src'))})}
function showSlide(src,bgsrc){
 const t=tok,n=1-si,S=SL[n],img=S.querySelector('.ph'),bg=S.querySelector('.bg');
 if(S.className!=='sl'){S.style.transition='none';S.className='sl';void S.offsetWidth;S.style.transition=''}
 const go=()=>{if(t!==tok)return;fit(img,img.naturalWidth,img.naturalHeight);bg.style.visibility=img.style.objectFit==='contain'?'visible':'hidden';
  const old=SL[si];old.className='sl old';S.className='sl on';si=n;setTimeout(()=>{if(old.className==='sl old')old.className='sl'},(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fade'))||0)*1000+80)};
 bgsrc?bg.src=bgsrc:bg.removeAttribute('src');
 if(!src){img.removeAttribute('src');go();return}
 img.src=src;(img.decode?img.decode():Promise.reject()).then(go,go)
}
function media(p){tok++;
 if(p.type==='video'){showSlide(p.thumb||'',p.thumb||'');VD.hidden=false;$('#vc').hidden=false;VD.poster=p.thumb||'';VD.muted=muted;VD.src=p.src;
  VD.play().catch(()=>{muted=VD.muted=true;VD.play().catch(()=>{})});upd()}
 else{stopVid();VD.hidden=true;$('#vc').hidden=true;showSlide(p.med||p.src,p.thumb||p.med||p.src)}
}
['play','pause','volumechange'].forEach(ev=>VD.addEventListener(ev,upd));
VD.addEventListener('loadedmetadata',()=>refit());
$('#pp').onclick=e=>{e.stopPropagation();VD.paused?VD.play():VD.pause()};
$('#mu').onclick=e=>{e.stopPropagation();VD.muted=!VD.muted;muted=VD.muted;upd()};
function show(j,first){
 const s=steps[view.i];
 j=Math.max(0,Math.min(j,s.photos.length-1));view.j=j;const p=s.photos[j];
 media(p);pre(s.photos[j+1]);pre(s.photos[j+2]);pre(s.photos[j-1]);$('#t').innerHTML=mdi(s.name);
 $('#m').textContent=[fmt(p.date),p.lat==null?'':p.lat.toFixed(3)+'°, '+p.lng.toFixed(3)+'°'].filter(Boolean).join('  ·  ');
 $('#d').innerHTML=md(p.text||(j===0?s.desc:'')||'');
 [...$('#prog').children].forEach((e,k)=>e.className=k<=j?'d':'');
 G.eachLayer(l=>{if(l.getElement){const el=l.getElement().firstChild;el&&el.classList.toggle('on',l.getLatLng().equals(loc(p)))}});
 if(!first&&loc(p)){clearTimeout(mapT);mapT=setTimeout(()=>M.fitBounds(L.latLngBounds([loc(p),loc(p)]),{...pad(),maxZoom:Math.max(M.getZoom(),15),duration:.5}),220)}
}
function setFull(on){full=on;const W=$('#viewer');W.style.transform='';W.classList.toggle('full',on);refit(innerWidth,on?innerHeight:innerHeight-240);setTimeout(()=>refit(),450)}
function closeView(){stopVid();view=null;full=false;$('#viewer').classList.remove('full');$('#viewer').style.transform='';document.body.classList.remove('inview');$('#viewer').classList.remove('on');setTimeout(()=>{M.invalidateSize();homeMap(true)},300)}
$('#back').onclick=closeView;
$('#prev').onclick=e=>{e.stopPropagation();view&&show(view.j-1)};
$('#next').onclick=e=>{e.stopPropagation();view&&show(view.j+1)};
$('#lay').onclick=()=>{sat=!sat;M.removeLayer(sat?PLAN:SAT);M.addLayer(sat?SAT:PLAN)};
addEventListener('keydown',e=>{if(!view)return;if(e.key==='ArrowRight')show(view.j+1);if(e.key==='ArrowLeft')show(view.j-1);if(e.key==='Escape')closeView()});
// glisser : côtés = photo suivante/précédente, vers le bas = fermer le step
let x0=null,y0=0,drag=false;const V=$('#viewer');
V.addEventListener('pointerdown',e=>{if(e.target.closest('#vc,.nv'))return;x0=e.clientX;y0=e.clientY;drag=false});
V.addEventListener('pointermove',e=>{if(x0===null||DESK.matches)return;const dx=e.clientX-x0,dy=e.clientY-y0;
 if(dy>10&&dy>Math.abs(dx)){drag=true;V.style.transition='none';V.style.transform=`translateY(${dy}px)`}});
V.addEventListener('pointerup',e=>{if(x0===null||!view)return;const dx=e.clientX-x0,dy=e.clientY-y0;x0=null;V.style.transition='';
 if(drag){drag=false;if(dy>110){if(full)setFull(false);else closeView()}else V.style.transform='';return}
 if(dy<-70&&-dy>Math.abs(dx)*1.2&&!DESK.matches){if(!full)setFull(true);return}
 if(dx<-50)show(view.j+1);else if(dx>50)show(view.j-1);
 else if(Math.abs(dx)<10&&Math.abs(dy)<10){const r=(e.clientX-V.getBoundingClientRect().left)/V.clientWidth,vid=steps[view.i].photos[view.j].type==='video';
  if(r<.3)show(view.j-1);else if(vid&&r<.7){VD.paused?VD.play():VD.pause()}else show(view.j+1)}});
V.addEventListener('pointercancel',()=>{x0=null;drag=false;V.style.transition='';V.style.transform=''});
// séparateur redimensionnable (ordinateur) : largeur mémorisée dans le navigateur
(()=>{const SP=$('#split'),R=document.documentElement,KEY='albumSideW';let raf=0;
 const max=()=>Math.max(320,Math.min(innerWidth*.7,innerWidth-320));
 const cur=()=>parseInt(getComputedStyle(R).getPropertyValue('--side'))||440;
 const apply=w=>{w=Math.round(Math.min(max(),Math.max(300,w)));R.style.setProperty('--side',w+'px');cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{M.invalidateSize({animate:false,pan:false});refit()});return w};
 const save=w=>{try{localStorage.setItem(KEY,w)}catch{}};
 try{const w=+localStorage.getItem(KEY);if(w)apply(w)}catch{}
 SP.addEventListener('pointerdown',e=>{SP.setPointerCapture(e.pointerId);document.body.classList.add('dragging');e.preventDefault()});
 SP.addEventListener('pointermove',e=>{if(SP.hasPointerCapture(e.pointerId))apply(e.clientX)});
 const end=()=>{if(document.body.classList.contains('dragging')){document.body.classList.remove('dragging');save(cur())}};
 SP.addEventListener('pointerup',end);SP.addEventListener('pointercancel',end);
 SP.addEventListener('dblclick',()=>save(apply(440)));
 SP.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();e.stopPropagation();save(apply(cur()+(e.key==='ArrowLeft'?-20:20)))}});
 addEventListener('resize',()=>apply(cur()));
})();
</script>
